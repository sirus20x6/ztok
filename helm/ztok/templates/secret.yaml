{{- if and .Values.auth.enabled .Values.auth.create -}}
{{/*
Chart-managed auth secret. Most production users should keep
auth.create=false and manage this secret with sealed-secrets,
external-secrets, or Vault — but for quickstart / dev installs the
in-line path is convenient.

The secret name is derived (not user-overridable) so the deployment
template's checksum annotation always lines up; if you need a custom
name, set auth.create=false and bring your own.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ztok.authSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ztok.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ztok reads the entire file as the token (a single trailing newline
  # is stripped server-side). Keep this value out of source control —
  # use `--set-string auth.tokenValue=...` or a values override file.
  token: {{ required "auth.tokenValue is required when auth.create=true" .Values.auth.tokenValue | quote }}
{{- end }}
