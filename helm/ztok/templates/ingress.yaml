{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ztok.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ztok.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          # Accept either a list of strings (chart-spec sugar) OR a
          # list of objects with path/pathType. Defaults pathType to
          # `Prefix` when only a string is given.
          {{- if kindIs "string" . }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ztok.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- else }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "ztok.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
